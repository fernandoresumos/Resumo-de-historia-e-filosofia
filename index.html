<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="description" content="Cursos completos de Filosofia e História reunidos em um HTML offline, com abas independentes.">
  <title>Central de Estudos | Filosofia e História</title>
  <style>
    :root{color-scheme:light;--ink:#213c38;--sub:#697974;--line:#dbe4df;--muted:#f5f7f4;--gold:#c29b63;--green:#2c655c;--purple:#516d82}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--muted);color:var(--ink);display:flex;flex-direction:column}
    button{font:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid #539c91;outline-offset:3px}
    .course-header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:22px;flex:none;min-height:76px;padding:11px clamp(16px,3vw,42px);background:#ffffff;border-bottom:1px solid var(--line);box-shadow:0 3px 15px rgba(37,63,52,.035)}
    .brand{display:flex;align-items:center;gap:11px;flex:none;min-width:0}
    .brand-symbol{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#e8f1eb;color:#356f5e}
    .brand-text{line-height:1.19}
    .brand-text strong{font-size:15px;font-weight:760;letter-spacing:-.02em;display:block}
    .brand-text small{display:block;font-size:10px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;color:var(--sub);margin-top:4px}
    .tabs{display:flex;align-items:center;justify-content:center;gap:5px;padding:5px;border-radius:16px;background:#f2f5f2;border:1px solid #e4ece6}
    .tab{display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:11px;background:transparent;color:#63716b;padding:10px 22px;min-width:148px;font-weight:740;font-size:13px;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
    .tab svg{flex:none}
    .tab:hover{background:#fffafc;color:#203b36}
    .tab[aria-selected="true"]{background:#fff;color:#2d594d;box-shadow:0 2px 9px #123f3113;border-color:#dfe7df}
    .tab[data-course="filosofia"][aria-selected="true"]{color:#39627b}
    .tab[data-course="historia"][aria-selected="true"]{color:#365f4e}
    .note{flex:none;font-size:11px;font-weight:650;color:#809087;text-align:right;letter-spacing:.01em}
    .studybar{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:8px clamp(16px,3vw,42px);background:#fbfcfa;border-bottom:1px solid #e0e8e2}
    .studybar-title{font-size:11px;letter-spacing:.12em;font-weight:850;color:#7b8981;text-transform:uppercase;white-space:nowrap}
    .study-options{display:flex;gap:7px;min-width:0;overflow-x:auto;scrollbar-width:none}.study-options::-webkit-scrollbar{display:none}
    .subtab{white-space:nowrap;border:1px solid #dde6de;border-radius:10px;padding:9px 16px;background:white;color:#617a70;font-size:12px;font-weight:750}
    .subtab.active{background:#e1f0e8;border-color:#a6d0bb;color:#1e5b45}.study-options[data-subject="filosofia"] .subtab.active{background:#e4f0f7;border-color:#b2d2e6;color:#285e7e}
    .course-frame[hidden]{display:none}
    .workspace{flex:1;min-height:0;position:relative;background:#f7f8f7}
    .pane{position:absolute;inset:0}
    .pane[hidden]{display:none}
    .course-frame{width:100%;height:100%;border:0;display:block;background:white}
    .loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;color:#62766c;background:#f6f8f6;font-size:13px}
    .loading[hidden]{display:none}
    .spinner{width:29px;height:29px;border-radius:50%;border:3px solid #dbe9e4;border-top-color:#497c6a;animation:turn .9s linear infinite;justify-self:center}
    @keyframes turn{to{transform:rotate(360deg)}}
    .status{position:absolute;right:14px;bottom:13px;background:#fcf7f4;padding:13px 15px;border:1px solid #e8b8a4;box-shadow:0 12px 30px #0001;border-radius:12px;color:#703a31;font-size:12px;max-width:360px}
    .status[hidden]{display:none}
    @media(max-width:800px){.note{display:none}.course-header{min-height:70px;gap:10px}.tab{min-width:135px;padding:10px 14px}.brand-text small{font-size:9px}}
    @media(max-width:610px){.studybar{gap:9px;padding:7px 10px}.studybar-title{font-size:9px}.subtab{padding:9px 12px;font-size:11px}.course-header{flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 12px}.brand{justify-content:center}.brand-symbol{width:32px;height:32px;font-size:18px}.brand-text strong{font-size:13px}.brand-text small{font-size:9px}.tabs{width:100%;border-radius:12px}.tab{flex:1;min-width:0;padding:9px 10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>

  <script>
  (() => {
    'use strict';
    const names = ['filosofia','historia'];
    const loaded = new Set();
    const modeBySubject = {filosofia:'curso',historia:'curso'};
    let activeSubject = 'filosofia';
    const getMode=() => modeBySubject[activeSubject];
    const modes=['curso','mission','bank','progress'];
    const studyOptions=document.getElementById('studyOptions');
    const label=document.getElementById('studybarLabel');
    const tablist = document.querySelector('[role="tablist"]');
    const status = document.getElementById('status');
    function decode(name){
      const encoded = document.getElementById('payload-' + name).textContent.trim();
      const binary = atob(encoded);
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder('utf-8', {fatal:true}).decode(bytes);
    }
    function loadCourse(name){
      if(loaded.has(name)) return;
      try{
        const frame = document.getElementById('iframe-' + name);
        frame.addEventListener('load', () => {
          document.getElementById('loading-' + name).hidden = true;
        }, {once: true});
        frame.srcdoc = decode(name);
        loaded.add(name);
      }catch(error){
        document.getElementById('loading-' + name).hidden = true;
        status.textContent = 'Não foi possível abrir este curso: ' + error.message;
        status.hidden = false;
      }
    }
    function loadQuiz(subject){
      const name = 'quiz-' + subject;
      if(loaded.has(name)) return;
      try{
        const frame = document.getElementById('iframe-'+name);
        frame.addEventListener('load', () => {
          document.getElementById('loading-'+name).hidden = true;
          frame.contentWindow.postMessage({type:'central-quiz-open',view:getMode()==='curso'?'mission':getMode()},'*');
        }, {once:true});
        frame.srcdoc=decode(name);
        loaded.add(name);
      }catch(error){
        document.getElementById('loading-'+name).hidden=true;
        status.textContent='Não foi possível abrir as questões: '+error.message;
        status.hidden=false;
      }
    }
    function showCurrentMode(){
      const current=getMode();
      label.textContent=activeSubject==='filosofia'?'FILOSOFIA':'HISTÓRIA';
      studyOptions.dataset.subject=activeSubject;
      for(const button of studyOptions.querySelectorAll('button')){
        const active=button.dataset.mode===current;
        button.classList.toggle('active',active);
        button.setAttribute('aria-pressed',String(active));
      }
      for(const subject of names){
        const pane=document.getElementById('pane-'+subject);
        const courseFrame=document.getElementById('iframe-'+subject);
        const quizFrame=document.getElementById('iframe-quiz-'+subject);
        const courseShown=subject===activeSubject && current==='curso';
        const quizShown=subject===activeSubject && current!=='curso';
        courseFrame.hidden=!courseShown;
        quizFrame.hidden=!quizShown;
        document.getElementById('loading-'+subject).hidden=!courseShown || loaded.has(subject);
        document.getElementById('loading-quiz-'+subject).hidden=!quizShown || loaded.has('quiz-'+subject);
        if(pane.hidden) continue;
        if(courseShown)loadCourse(subject);
        if(quizShown){
          loadQuiz(subject);
          if(loaded.has('quiz-'+subject)){
            try{quizFrame.contentWindow.postMessage({type:'central-quiz-open',view:current},'*')}catch{}
          }
        }
      }
      try{localStorage.setItem('central-estudos-modo-'+activeSubject+'-v1',current)}catch{}
    }
    function setMode(mode){
      if(!modes.includes(mode))return;
      modeBySubject[activeSubject]=mode;
      showCurrentMode();
    }
    studyOptions.addEventListener('click',e=>{
      const button=e.target.closest('[data-mode]');
      if(button)setMode(button.dataset.mode);
    });
    window.addEventListener('message', e=>{
      const d=e.data;
      if(!d||d.type!=='central-quiz-view'||!names.includes(d.subject))return;
      if(d.subject===activeSubject && modes.includes(d.view)){
        modeBySubject[activeSubject]=d.view;
        for(const button of studyOptions.querySelectorAll('button')){
          const active=button.dataset.mode===d.view;
          button.classList.toggle('active',active);
          button.setAttribute('aria-pressed',String(active));
        }
        try{localStorage.setItem('central-estudos-modo-'+activeSubject+'-v1',d.view)}catch{}
      }
    });
    function setTab(name, focus=false){
      if(!names.includes(name)) return;
      for(const course of names){
        const current = course === name;
        document.getElementById('pane-' + course).hidden = !current;
        const button = document.getElementById('tab-' + course);
        button.setAttribute('aria-selected', String(current));
        button.tabIndex = current ? 0 : -1;
      }
      activeSubject=name;
      showCurrentMode();
      if(focus) document.getElementById('tab-' + name).focus();
      try{localStorage.setItem('central-estudos-aba-ativa-v1',name)}catch{}
    }
    tablist.addEventListener('click', e => {
      const tab=e.target.closest('[role="tab"]');
      if(tab) setTab(tab.dataset.course);
    });
    tablist.addEventListener('keydown', e => {
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      const current = names.findIndex(name => document.getElementById('tab-'+name).getAttribute('aria-selected')==='true');
      const next = e.key==='Home'?0:e.key==='End'?names.length-1:(current + (e.key==='ArrowRight'?1:-1) + names.length)%names.length;
      e.preventDefault();
      setTab(names[next], true);
    });
    let initial = 'filosofia';
    try { const previous=localStorage.getItem('central-estudos-aba-ativa-v1'); if(names.includes(previous)) initial=previous; }catch{}
    for(const subject of names){
      try{const value=localStorage.getItem('central-estudos-modo-'+subject+'-v1');if(modes.includes(value))modeBySubject[subject]=value}catch{}
    }
    setTab(initial);
  })();
  </script>
</body>
